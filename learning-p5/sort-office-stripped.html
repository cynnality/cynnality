<!DOCTYPE html> 
<html lang="en"> 
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sort office</title>
  <link rel="stylesheet" href="sort-office.css">
</head>

<body>
  <div class="page">

    <!-- HUD: dynamic content injected by JS -->
    <aside id="hud" aria-label="Controls and Status">
     <!-- <div id="hud-status" class="status" role="status" aria-live="polite">ready!</div> -->

      <div class="hudsec-container">

        <div class="hud-section">
          <div class="hudsec-title">UTILS</div>
          <div class="hud-list" id="hud-utility-list"></div>
        </div>
      <div class="hud-section">
            <div class="hudsec-title">LOCKS</div>
            <div class="hud-list" id="hud-guides-list"></div>
        </div>
        <div class="hud-section">
            <div class="hudsec-title">MOVE</div>
            <div class="hud-list" id="hud-move-list"></div>
        </div>
      </div>
      

    <!-- ADDING THE HUD FAUXBAR HERE -->
        <div class="hud-fauxbar" aria-hidden="true"></div>
    </aside>
    
    <!-- status panel will NOT be docked by js // html decides placement -->
    <div id="hud-status" data-nodock="true" class="status" role="status" aria-live="polite">ready!</div>

    <!-- Main: canvas + queue -->
    <main class="main">
      <div id="canvas-and-queue" class="canvas-row">
        <div id="canvas-holder" aria-label="Sorter Canvas"></div>
      </div>

    </main>
            <div id="queue-holder" aria-label="Removed tiles">

          <!--
          <div class="status-box">
            <div class="box-options">
              <div class="hud-row"><strong>mode:</strong>   <span id="hud-mode" class="hud-pill">—</span></div>
              <div class="hud-row"><strong>guide:</strong>  <span id="hud-guide" class="hud-pill">—</span></div>
              <div class="hud-row"><strong>queue:</strong>  <span id="hud-queue" class="hud-pill">0</span></div>
              <div class="hud-row"><strong>inspect:</strong><span id="hud-inspect" class="hud-pill">Off</span></div>
              <div class="hud-row"><strong>diff:</strong>   <span id="hud-diff" class="hud-pill">Off</span></div>
            </div>
          </div>
          -->
                    

          <!-- Pills + tips are injected by JS here -->
          <div id="queue-mode-info" class="q-info"></div>

          <div id="queue-next">
            <span id="queue-next-label"></span>
            <span id="queue-help"></span>
            <div class="queue-cell"></div>
          </div>

          <div id="queue-grid"></div>
        </div>
        <!--=== KEYBOARD LEGEND 
      <section id="key-legend" aria-label="Keyboard Function Legend">
        <div class="key-legend-header">
          <label class="key-legend-toggle">
            <input type="checkbox" id="legend-label-toggle">
            <span>show labels</span>
          </label>
        </div>

        <div id="keyboard-layout">
          <div class="keyboard-row row-esc">
            <button class="hud-key key-Escape" data-key="Esc">Escape</button>
          </div>

          <div class="keyboard-row row-1">
            <button class="hud-key key-Q" data-key="Q">Q</button>
            <button class="hud-key key-W" data-key="W">W</button>
            <button class="hud-key key-E" data-key="E">E</button>
            <button class="hud-key key-R" data-key="R">R</button>
            <button class="hud-key key-T" data-key="T">T</button>
            <button class="hud-key key-Y" data-key="Y">Y</button>
            <button class="hud-key key-U" data-key="U">U</button>
            <button class="hud-key key-I" data-key="I">I</button>
            <button class="hud-key key-O" data-key="O">O</button>
            <button class="hud-key key-P" data-key="P">P</button>
            <button class="hud-key key-u5b" data-key="[">[</button>
            <button class="hud-key key-u5d" data-key="]">]</button>  
          </div>

          <div class="keyboard-row row-2">
            <button class="hud-key key-A" data-key="A">A</button>
            <button class="hud-key key-S" data-key="S" data-geom="1">S</button>
            <button class="hud-key key-D" data-key="D">D</button>
            <button class="hud-key key-F" data-key="F">F</button>
            <button class="hud-key key-G" data-key="G">G</button>
            <button class="hud-key key-H" data-key="H">H</button>
            <button class="hud-key key-J" data-key="J">J</button>
            <button class="hud-key key-K" data-key="K">K</button>
            <button class="hud-key key-L" data-key="L">L</button>
          </div>

          <div class="keyboard-row row-3">
            <button class="hud-key key-Z" data-key="Z">Z</button>
            <button class="hud-key key-X" data-key="X">X</button>
            <button class="hud-key key-C" data-key="C">C</button>
            <button class="hud-key key-V" data-key="V">V</button>
            <button class="hud-key key-B" data-key="B">B</button>
            <button class="hud-key key-N" data-key="N">N</button>
            <button class="hud-key key-M" data-key="M">M</button>
          </div>
           -- label bands for row callouts --
          <div class="keyboard-arrows">
            <div class="arrow-keys">
              <button class="hud-key" data-key="↑">↑</button>
              <div class="arrow-bottom">
                <button class="hud-key" data-key="←">←</button>
                <button class="hud-key" data-key="↓">↓</button>
                <button class="hud-key" data-key="→">→</button>
              </div>
            </div>
          </div>
                   
          <div class="legend-band band-row1" aria-hidden="true"></div>
          <div class="legend-band band-row2" aria-hidden="true"></div>
          <div class="legend-band band-row3" aria-hidden="true"></div>
-->
        </div>
      </section>


      <!--=== END KEYBOARD LEGEND ===-->
  </div> 

  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.2/lib/p5.min.js"></script>
  <script src="gradientGen.js"></script>
  <script type="module" src="sort-office-core.js"></script>
</body>
</html>
