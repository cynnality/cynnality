<script>
const PLAYER_SVGS = {
  "t_th": "/fp_listing_svgs/t_th_fdp.svg",
  "de_he": "/fp_listing_svgs/de_he_fdp.svg",
  "ma_d": "/fp_listing_svgs/ma_d_fdp.svg",
  "c_h": "/fp_listing_svgs/c_h_fdp.svg",
  "a_wau": "/fp_listing_svgs/a_wau_fdp.svg",
  "lau_j": "/fp_listing_svgs/lau_j_fdp.svg",
  "su_bi": "/fp_listing_svgs/su_bi_fdp.svg",
  "la_th": "/fp_listing_svgs/la_th_fdp.svg",
  "d_t": "/fp_listing_svgs/d_t_fdp.svg",
};
</script>

<script>
const displayContainer = document.getElementById("player-display");

document.querySelectorAll(".player-elemental-box").forEach(box => {
  box.addEventListener("click", () => {
    const playerId = box.id;
    const svgPath = PLAYER_SVGS[playerId];

    if (!svgPath) return;

    fetch(svgPath)
    .then(res => res.text())
    .then(svgText => {

        // convert string → DOM element
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgText, "image/svg+xml");
        const svgEl = doc.querySelector("svg");

        // add your class
        svgEl.classList.add("player-svg");

        // clear + append
        displayContainer.innerHTML = "";
        displayContainer.appendChild(svgEl);
    });
  });
});
</script>
