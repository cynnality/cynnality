<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WNBA Championships Viewer</title>

        <!-- ======================== MONO FONTS ========================
            CHIVO MONO 
            ---- (monospaced // kinda playful ? serif) 

            DM MONO 
            ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

            JET BRAINS MONO 
            ---- (monospaced, generally sans-serif. 
            ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
            ============================================================-->

        <!--=====================================================================================

    COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

    wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
    wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
    wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
    wnba_reg_season_awards.json /////// -> regular season PLAYER awards
    wnba_season_stats.json //////////// -> regular season team rankings
    wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
    wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

    =====================================================================================-->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
            rel="stylesheet">
        <!--=====================================================================================-->

  <link rel="stylesheet" href="wnba-championships-viewer.css" />
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">Generated from player data</p>
      <h1>WNBA Championships</h1>
      <p>Championships found in the current main player file.</p>
    </header>

    <section class="summary-strip">
      <div><strong id="titleCount">0</strong><span>title rows</span></div>
      <div><strong id="playerCount">0</strong><span>source players</span></div>
      <div><strong id="mvpCount">0</strong><span>Finals MVP refs</span></div>
    </section>

    <section id="championshipList" class="championship-list"></section>
  </main>

  <script src="wnba-championships-viewer.js"></script>
</body>
</html>
