<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Regular Season Awards Viewer</title> 

            <!-- ======================== MONO FONTS ========================
                CHIVO MONO 
                ---- (monospaced // kinda playful ? serif) 

                DM MONO 
                ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

                JET BRAINS MONO 
                ---- (monospaced, generally sans-serif. 
                ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
                ============================================================-->

        <!--=====================================================================================

        COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

        wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
        wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
        wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
        wnba_reg_season_awards.json /////// -> regular season PLAYER awards
        wnba_season_stats.json //////////// -> regular season team rankings
        wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
        wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

        =====================================================================================-->

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link
                href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
                rel="stylesheet">
            <!--=====================================================================================-->

    <link rel="stylesheet" href="regular-season-awards-viewer.css" />
    <link rel="stylesheet" href="../basketball_101_shared/players/player-receipt-renderer.css" />
    <link rel="stylesheet" href="../entries/renderer/entries-renderer.css" />
</head>

<body>
    <main class="viewer-shell">
        <header class="viewer-header">
            <h1>Regular Season Awards</h1>
            <p>View entered regular season awards by season. Click an award recipient to open the player receipt.</p>
        </header>

        <section class="panel controls-panel">
            <label>
                Season
                <select id="seasonSelect"></select>
            </label>
        </section>

        <section class="panel entries-page-panel collapsed" id="pageEntriesPanel">
            <button
                class="entries-panel-toggle"
                type="button"
                data-closed-label="View page entries"
                data-open-label="Hide page entries">
                View page entries
            </button>

            <div class="entries-panel-body">
                <div id="pageEntriesList" class="page-entries-list"></div>
            </div>
        </section>

        <section class="panel">
            <div class="section-heading">
                <h2 id="seasonTitle">Awards</h2>
                <p id="awardCountText"></p>
            </div>

            <div id="awardsGrid" class="awards-grid"></div>
        </section>
    </main>

    <div id="entryModal" class="entry-modal hidden">
        <div class="entry-modal-backdrop" id="entryModalBackdrop"></div>

        <article class="entry-modal-card">
            <button id="closeEntryModalBtn" class="entry-modal-close" type="button">
                ×
            </button>

            <p id="entryModalCategory" class="entry-modal-category"></p>
            <h2 id="entryModalTitle"></h2>
            <p id="entryModalDescription" class="entry-modal-description"></p>

            <div id="entryModalContent" class="entry-modal-content"></div>
        </article>
    </div>

    <script src="../entries/renderer/entries-renderer.js"></script>
    <script src="../basketball_101_shared/players/player-receipt-renderer.js"></script>
    <script src="regular-season-awards-viewer.js"></script>

</body>
</html>
