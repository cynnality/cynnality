<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>:)</title>
  <link rel="stylesheet" href="main.css">
  <style>
    
    body {
    font-family: "Inter", sans-serif;
    font-style: normal;
    background: #e3e3e3; /* #E3E3E3 - neutral bg #7F00FF - blue-purple ---- cant decide */
    }

    .main-container {
      max-width: 700px;
      margin: 60px auto;
      background: #fff;
      border: 4px solid #222;
      box-shadow: 12px 12px 0 #222;
      padding: 48px 40px 40px 40px;
      border-radius: 0;
      text-align: center;
    }
    h1:not(.cynn-title, .study-storage-button h1) {
      font-size: 2.5rem;
      margin-bottom: 32px;
      letter-spacing: 1px;
      color: #222;
      background: #ffe600;
      display: inline-block;
      padding: 8px 24px;
      border: 3px solid #222;
      box-shadow: 4px 4px 0 #222;
    }
    .section-link {
      display: block;
      margin: 32px auto;
      padding: 28px 0;
      font-size: 1.4rem;
      font-weight: bold;
      color: #222;
      background: #fff;
      border: 3px solid #222;
      box-shadow: 6px 6px 0 #222;
      border-radius: 0;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      width: 90%;
      max-width: 420px;
    }
    .section-link:hover {
      background: #ffe600;
      color: #111;
    }
    .section-desc {
      font-size: 1.05rem;
      color: #444;
      margin-bottom: 8px;
    }

.study-storage-button {
      position: relative;
      text-align: center;
      width: 300px;
      height: 300px;
      margin: auto;
    }


.page-link {
      z-index: 100;
      border: none;
      background: none;
      box-shadow: none;
      outline: none;
      cursor: pointer;
      display: inline-block;
}

.icon-link-img {
      width: 200px;   
      height: 200px;
      display: block;
      border: none;
      background: none; 
      box-shadow: none;
      outline: none;
      filter: drop-shadow(2px 2px 0 #00000033);
      transition: transform 0.1s;
}

.general-notes-button {
      position: absolute;
      top: 18vh;   
      left: 28vw;  
}

.flashcards-button {
      position: absolute;
      top: 63vh;
      left: 49vw;  
}

.case-files-button {
      position: absolute;
      top: 63vh;
      left: 30vw;  
}

.page-link:hover .icon-link-img {
      transform: scale(1.08);
}
  
  
  
  
  
  </style>
</head>



<body>

  <div class="study-storage-button general-notes-button">
    <h1>general notes</h1>
        <a href="general-note.html" id="general-notes" class="page-link" title="go to notes">
          <img src="../assets/icons/binders-box-img.png" alt="binder-box" id="binder-box-icon" class="icon-link-img" />
        </a>
  </div>

  <div class="study-storage-button flashcards-button">
      <h1>flashcards</h1>
        <a href="flashcards.html" id="flashcards" class="page-link" title="go to flashcards">
          <img src="../assets/icons/flashcard-img.png" alt="flashcards" id="flashcards-icon" class="icon-link-img" />
        </a>
  </div>

  <div class="study-storage-button case-files-button">
      <h1>case files</h1>
        <a href="case-notes.html" id="case-files" class="page-link" title="go to case files">
          <img src="../assets/icons/case-files.png" alt="case files" id="case-files-icon" class="icon-link-img" />
        </a>
  </div>


</body>
</html>
