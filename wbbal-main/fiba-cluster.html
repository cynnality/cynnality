</button>

<div class="cluster">

   viewBox="0 0 1920 1080"
   version="1.1"
   id="svg1"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <style
     id="style8">
      .connecting-lines {  }

      .icon-label {   }
      .icon-art {   }
      .icon {   }
</style>
  <defs
     id="defs1" />




  <g

     style="display:inline">
    <g
       id="cluster-root"
       class="org-detail">
      <rect
         id="cluster-root-panel"
         x="30"
         y="20"
         width="330"
         height="140" />
      <rect
         id="cluster-root-container"
         x="30"
         y="20"
         class="org-detail-container"
         width="330"
         height="120" />
      <rect
         id="cluster-switch-indicator"
         x="310"
         y="20"
         width="50"
         class="switch-indicator"
         height="50" />
      <g
         id="cluster-root-label-group">
        <text
           x="40"
           y="124.19695"
           id="cluster-root-label-1"
           class="box-label"
           xml:space="default"></text>
        <text
           x="110"
           y="124.19695"
           id="cluster-root-label-2"
           class="box-label"
           xml:space="default"></text>
        <text
           x="225"
           y="124.19695"
           id="cluster-root-label-3"
           class="box-label"
           xml:space="default"></text>
      </g>
      <g
         id="cluster-header"
         transform="translate(-5,-30)">
        <rect
           id="cluster-header-container"
           x="35"
           y="50"
           width="280"
           height="80"
           class="org-header-container" />
        <text
           id="cluster-title-text"
           x="145"
           y="120"
           class="org-title-text"
           xml:space="default"
           text-anchor="middle" />
      </g>
    </g>

     class="box-group">
    <rect

       class="box-frame "
       width="164"
       height="80"
       x="60"
       y="200" />
    <rect
       id="events-root-container"
       width="143.00002"
       height="60"
       x="50.00"
       y="190"
       class="box  box-accent" />
    <text
       xml:space="preserve"
       x="100.00003"
       y="230"
       id="events-root-label"
       style="text-anchor:middle"
       class="box-label" />
  </g>

  <g
     id="world-cup-event"
     class="box-group">
    <rect
       id="world-cup-event-generic-frame"
       class="box-frame"
       width="124"
       height="130"
       x="150"
       y="280" />
    <rect
       id="world-cup-event-container"
       width="103"
       height="95"
       x="160"

       class="label-group">
      <text
         x="210"
         y="340"
         id="world-cup-label-1"

      <text

         y="360"

         text-anchor="middle"

  </g>

      <rect id="olympic-qualification-container" class="box-accent" x="270" height="70" y="180" width="140"></rect>
      <g id="g16">
         <text id="olympic-qualification-label-1" class="box-label" xml:space="default" text-anchor="middle" x="335" y="210"></text>
         <text id="olympic-qualification-label-2" class="box-label" xml:space="default" text-anchor="middle" x="340" y="230"></text>

       y="515.5" />
    <rect
       id="fiba-rules-container"
       width="103"
       height="103"
       x="130"
       y="520"
       class="box  box-accent" />
    <g
       id="fiba-rules-label-group"
       class="label-group">
      <text
         x="167.51953"
         y="568.23322"
         id="fiba-rules-label-1"
         class="box-label"
         xml:space="default" />
      <text
         x="161.74219"
         y="583.34491"
         id="fiba-rules-label-2"
         class="box-label"
         xml:space="default" />
    </g>
  </g>
  <g
     id="olympic-rules"

       width="103"
       height="103"
       x="130"
       y="640"
       class="org-icon-container  box-accent" />
    <g
       id="olympic-rules-label-group"
       class="label-group">
      <text
         x="155.80078"
         y="680.80579"
         id="olympic-rules-label-1"
         class="box-label"
         xml:space="default" />
      <text

         y="695.86816"

         xml:space="default" />
    </g>

  <g

     class="box-group">
    <rect
       id="fiba-pro-play-generic-frame"
       class="box-frame "
       width="112"
       height="112"
       x="125.5"
       y="755.5" />
    <rect
       id="pro-play-container"
       width="103"
       height="103"

      <text

         y="814.70508"

         class="box-label"
         xml:space="default" />
      <text
         x="168.43066"
         y="829.76746"
         id="fiba-pro-play-label-3"
         class="box-label"
         xml:space="default" />

  </g>

  <g
     id="cluster-description">

-->

       width="112"
       height="112"
       x="125.5"
       y="395.5" />
    <rect
       id="rules-root-container"
       width="103"
       height="103"
       x="130"
       y="400"
       class="box  box-accent" />
    <text
       xml:space="preserve"
       x="181.50003"
       y="459.71329"
       id="rules-root-label"
       style="text-anchor:middle"
       class="box-label" />
  </g>

<g id="folder-mount-point"></g>

</div>
