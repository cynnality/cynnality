<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

<style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #e3e3e3;
        }

        .lab-cynn {
            display: block;
        }

        .curio-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1em;
            gap: 1.25em;
            font-style: italic;
            border-top: 4px solid #000000;
            border-bottom: 4px solid #000000;
        }
        .curio-bar p {
            font-size: .99em;
        }

        .off-center-box {
            display: grid;
            position: relative;
        }
        .off-center-box .outie {
            display: grid;
            border: 2px solid #000000;
        }
        .off-center-box .innie {
            display: grid;
            align-self: center;
            justify-self: center;
            transition: transform 0.1s ease-in-out;
            position: relative;
        }
        .off-center-box .innie:hover {
            transform: scale(1.35);
            z-index: 1;
        }
        .off-center-box .innie .innie-text {
            align-self: center;
            justify-self: center;
            font-family: "Inter", sans-serif;
            font-style: italic;
            font-size: 1em;
            color: #000000;
        }
        .off-center-box a {
            align-self: center;
            justify-self: center;
            font-family: "Inter", sans-serif;
            font-style: italic;
            font-size: 1em;
            color: #000000;
            text-decoration: none;
        }

        .off-center-box.green {
            top: -1.1em;
            left: 40em;
        }
        .off-center-box.green .outie {
            width: 12em;
            height: 12em;
        }
        .off-center-box.green .innie {
            width: 9em;
            height: 9em;
            background-color: #00de51;
        }

        .off-center-box.blue {
            top: -4.5em;
            left: 49em;
        }
        .off-center-box.blue .outie {
            width: 18em;
            height: 18em;
        }
        .off-center-box.blue .innie {
            width: 15em;
            height: 15em;
            background-color: #1a4cff;
        }
        .off-center-box.blue .innie:hover {
        transform: scale(1.23);
        }

        .off-center-box.red {
            top: -8.75em;
            left: 63em;
        }
        .off-center-box.red .outie {
            width: 20em;
            height: 20em;
        }
        .off-center-box.red .innie {
            width: 15em;
            height: 15em;
            background-color: #ff211d;
        }


</style>

</head>
<body>

    <div class="opening-theme">
        <img src="assets/lab-cynn/normed-header.png" alt="sticker" class="lab-cynn sticker" />

    <div class="curio-bar">
        <p>enter with curiosity</p>
        <p>enter with curiosity</p>

        <p>enter with curiosity</p>

        <p>enter with curiosity</p>
        <p>enter with curiosity</p>
        <p>enter with curiosity</p>
        <p>enter with curiosity</p>
        <p>enter with curiosity</p>
        <p>enter with curiosity</p>
    </div>
    <div class="off-center-box green">
        <div class="outie">
            <a href="sandbox/sandbox.html">
                <div class="innie">
                    <div class="innie-text">
                        <h1>about</h1>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <div class="off-center-box blue">
        <div class="outie">
            <a href="courts/main-court.html">
                <div class="innie">
                    <div class="innie-text">
                        <h1>courts</h1>
                    </div>
                </div>
            </a>
        </div>
    </div>
    <div class="off-center-box red">
        <div class="outie">
