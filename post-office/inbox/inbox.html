<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Post Office | Inbox</title>

            <!-- ======================== MONO FONTS ========================
                CHIVO MONO 
                ---- (monospaced // kinda playful ? serif) 

                DM MONO 
                ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

                JET BRAINS MONO 
                ---- (monospaced, generally sans-serif. 
                ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
                ============================================================-->

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
        <!--=====================================================================================-->

    <link rel="stylesheet" href="inbox.css" />
</head>

<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Post Office</p>
            <h1>Inbox</h1>
            <p>Read submitted letters from the Post Office submissions channel.</p>
        </header>

        <section class="toolbar">
            <button id="loadLettersBtn" type="button">Load Letters</button>
            <p id="statusMessage">Ready.</p>
        </section>

        <section id="lettersList" class="letters-list"></section>
    </main>

    <script src="inbox.js"></script>
</body>
</html>
