<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Post Office | Letter Submission</title>

        <!-- ======================== MONO FONTS ========================
            CHIVO MONO 
            ---- (monospaced // kinda playful ? serif) 

            DM MONO 
            ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

            JET BRAINS MONO 
            ---- (monospaced, generally sans-serif. 
            ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
            ============================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <!--=====================================================================================-->

    <link rel="stylesheet" href="letter-submission.css" />
</head>

<body>
    <main class="page-shell">
        <header class="page-header">
            <p class="eyebrow">Post Office</p>
            <h1>Send a Letter</h1>
            <p>Send a question, correction, request, or note.</p>
        </header>

        <section class="panel">
            <label>
                Letter Title
                <input id="letterTitleInput" type="text" placeholder="Example: Question about A'ja Wilson" />
            </label>

            <label>
                Description
                <textarea id="letterDescriptionInput" placeholder="Short summary of what this is about"></textarea>
            </label>

            <label>
                Letter Content
                <textarea id="letterContentInput" class="content-box" placeholder="Write your letter here. Markdown is okay."></textarea>
            </label>

            <button id="sendLetterBtn" type="button">Send Letter</button>

            <p id="statusMessage" class="status-message"></p>
        </section>
    </main>

    <script src="letter-submission.js"></script>
</body>
</html>
