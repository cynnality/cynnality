<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Utility Entry Manager</title>

            <!--=====================================================================================

        COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

        wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
        wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
        wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
        wnba_reg_season_awards.json /////// -> regular season PLAYER awards
        wnba_season_stats.json //////////// -> regular season team rankings
        wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)

            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link
                href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
                rel="stylesheet">
            <!--=====================================================================================-->  

    <link rel="stylesheet" href="utility-entry-manager.css">
</head>
<body>

<main class="page-shell">
    <header class="top-pager">
        <h1><em>utility entry manager</em></h1>
    </header>

    <div class="tool-wrap utility-manager-layout">

        <section class="tool-shell">

            <section class="panel input">
                <div class="panel-header">
                    <h2>Open Utility Entries</h2>
                    <button id="reloadEntriesBtn" type="button">Reload</button>
                </div>

                <div id="openEntriesList" class="entry-list"></div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Resolved Utility Entries</h2>
                </div>

                <div id="resolvedEntriesList" class="entry-list"></div>
            </section>

        </section>

        <section class="panel data utility-detail-panel">
            <h2>Selected Entry</h2>

            <div id="selectedEntryDetails">
                <p>Select a utility entry to view details.</p>
            </div>

            <div class="utility-detail-actions">
                <button id="resolveSelectedBtn" type="button">Mark Resolved</button>
                <button id="reopenSelectedBtn" type="button">Reopen</button>
            </div>

            <details>
                <summary>Raw JSON</summary>
                <pre id="jsonPreview"></pre>
            </details>
        </section>

    </div>
</main>

<script src="../shared/utility-entry-service.js"></script>
<script src="utility-entry-manager.js"></script>
</body>
</html>
