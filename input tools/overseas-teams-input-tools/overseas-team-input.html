<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>overseas-team input</title>

    <!-- ======================== MONO FONTS ========================
         CHIVO MONO 
         ---- (monospaced // kinda playful ? serif) 

         DM MONO 
         ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

         JET BRAINS MONO 
         ---- (monospaced, generally sans-serif. 
         ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
         ============================================================-->

    <!--=====================================================================================

COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
wnba_reg_season_awards.json /////// -> regular season PLAYER awards
wnba_season_stats.json //////////// -> regular season team rankings
wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!--=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="overseas-team-input.css">
</head>

<body>

    <div class="top-pager">
        <h1><em>add an overseas team</em></h1>
    </div>

    <div class="tool-wrap">
        <section class="tool-shell">

            <div class="panel-group">
                <section class="panel input mini">
                    <div class="panel-header">
                        <h2>Names and codes</h2>

                    </div>

                    <div class="item">
                        <label for="teamName">Team name</label>
                        <input id="teamName" placeholder="ex: Fenerbahçe Opet">

                        <label for="teamCode">Team code</label>
                        <label for="teamCode" class="brow">Auto-generates from full team name, but can be edited.</label>
                        <input id="teamCode" placeholder="ex: fenerbahce_opet">
                    </div>

                    <div class="item">
                        <label for="leagueCode">League</label>
                        <select id="leagueCode">
                            <option value="">-- Select league --</option>
                        </select>
                    </div>
                </section>

                <section class="panel input mini">
                    <div class="panel-header">
                        <h2>Location</h2>

                    </div>

                    <div class="item">
                        <label for="locationInput">Location</label>
                        <label for="locationInput" class="brow">Enter as: Area, Country</label>
                        <input id="locationInput" placeholder="ex: Istanbul, Turkey">
                    </div>
                </section>
            </div>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Common names</h2>

                </div>

                <div class="item">
                    <div id="commonNamesList"></div>
                    <button id="addCommonNameBtn" type="button">Add Common Name</button>
                </div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Name history</h2>

                </div>

                <div class="item">
                    <div id="nameHistoryList"></div>
                    <button id="addNameHistoryBtn" type="button">Add Name History</button>
                </div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Links</h2>
                </div>

                <div class="item">
                    <div id="linksList"></div>
                    <button id="addLinkBtn" type="button">Add Link</button>
                </div>
            </section>

        </section>

        <section class="panel data">
            <h2>Data Preview</h2>

            <div class="tool-note">
                <p><strong>Note:</strong> This tool generates a single overseas team object.</p>
                <p class="path">input-tools → overseas-teams-input-tools → overseas-team-input.js</p>
            </div>

            <button id="copyJsonBtn" type="button">Copy JSON</button>
            <button id="saveJsonBtn" type="button">Save JSON File</button>
            <pre id="jsonPreview"></pre>
        </section>
    </div>

    <script src="overseas-team-input.js" defer></script>
</body>

</html>
