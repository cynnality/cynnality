<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>overseas-team input</title>

    <!-- ======================== MONO FONTS ========================
         CHIVO MONO 
         ---- (monospaced // kinda playful ? serif) 

         DM MONO 
         ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

         JET BRAINS MONO 
         ---- (monospaced, generally sans-serif. 
         ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
         ============================================================-->

    <!--=====================================================================================

COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
wnba_reg_season_awards.json /////// -> regular season PLAYER awards
wnba_season_stats.json //////////// -> regular season team rankings
wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!--=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">


    <link rel="stylesheet" href="overseas-team-input.css">
</head>

<body>

    <div class="top-pager">
        <h1><em>add an overseas team</em></h1>
        <button id="newTeamBtn" type="button">New Team</button>
    </div>

    <div class="tool-wrap">
        <section class="tool-shell">

            <div class="panel-group">
                <section class="panel input mini">
                    <div class="panel-header">
                        <h2>Names and codes</h2>

                    </div>

                    <div class="item">

                        <label for="displayName">Display name</label>
                        <input id="displayName" autocomplete="off" placeholder="ex: Fenerbahçe Opet">

                        <label for="clubName">Club / base name</label>
                        <input id="clubName" autocomplete="off" placeholder="ex: Fenerbahçe">

                        <label for="localName">Local / official language name</label>
                        <input id="localName" autocomplete="off" placeholder="ex: Fenerbahçe Opet">

                        <label for="currentSponsor">Current sponsor</label>
                        <input id="currentSponsor" autocomplete="off" placeholder="ex: Opet">

                        <label for="teamName">Team name</label>
                        <input id="teamName" placeholder="ex: Fenerbahçe Opet">

                        <label for="teamCode">Team code</label>
                        <label for="teamCode" class="brow">Auto-generates from full team name, but can be edited.</label>
                        <input id="teamCode" placeholder="ex: fenerbahce_opet">
                    </div>

                    <div class="item">
                        <label for="leagueCode">League</label>
                        <select id="leagueCode">
                            <option value="">-- Select league --</option>
                        </select>
                    </div>
                </section>

                <section class="panel input mini">
                    <div class="panel-header">
                        <h2>Location</h2>

                    </div>

                    <div class="item">
                        <label for="locationInput">Location display</label>
                        <label for="locationInput" class="brow">Use commas for any depth: town, city/province, country</label>
                        <input id="locationInput" placeholder="ex: Asan, South Chungcheong, South Korea">

                        <label for="cityInput">City / town</label>
                        <input id="cityInput" placeholder="auto-filled from location">

                        <label for="subRegionInput">State / province / district</label>
                        <input id="subRegionInput" placeholder="optional">

                        <label for="countryInput">Country</label>
                        <input id="countryInput" placeholder="auto-filled from location">
                    </div>
                </section>
            </div>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Team details</h2>
                </div>

                <div class="item">
                    <label for="arenaInput">Arena</label>
                    <input id="arenaInput" autocomplete="off" placeholder="ex: Ülker Sports Arena">

                    <label for="foundedYear">Founded year</label>
                    <input id="foundedYear" autocomplete="off" placeholder="ex: 1954">

                    <label for="defunctYear">Defunct year</label>
                    <input id="defunctYear" autocomplete="off" placeholder="leave blank if active">
                </div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Name details</h2>
                </div>

                <div class="item">
                    <h3>Abbreviations</h3>
                    <div id="abbreviationsList"></div>
                    <button id="addAbbreviationBtn" type="button">Add Abbreviation</button>
                </div>

                <div class="item">
                    <h3>English translations</h3>
                    <div id="englishTranslationsList"></div>
                    <button id="addEnglishTranslationBtn" type="button">Add English Translation</button>
                </div>

                <div class="item">
                    <h3>Other common names</h3>
                    <div id="commonNamesList"></div>
                    <button id="addCommonNameBtn" type="button">Add Common Name</button>
                </div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Name history</h2>

                </div>

                <div class="item">
                    <div id="nameHistoryList"></div>
                    <button id="addNameHistoryBtn" type="button">Add Name History</button>
                </div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Links</h2>
                </div>

                <div class="item">
                    <div id="linksList"></div>
                    <button id="addLinkBtn" type="button">Add Link</button>
                </div>
            </section>

            <section class="panel input">
                <div class="panel-header">
                    <h2>Meta notes</h2>
                </div>

                <div class="item">
                    <label for="metaNotes">Notes</label>
                    <textarea id="metaNotes" placeholder="Add notes, source reminders, confusion warnings, etc."></textarea>

                    <label for="lastUpdated">Last updated</label>
                    <input id="lastUpdated" autocomplete="off" placeholder="ex: 2026-05-21">
                </div>
            </section>

        </section>

        <aside class="side-rail">

            <section class="panel records-panel">
                <div class="panel-header">
                    <h2>Current Teams</h2>
                </div>

                <select id="teamLeagueFilter">
                    <option value="">All leagues</option>
                </select>

                <input id="teamSearchInput" autocomplete="off" placeholder="Search teams...">
                <div id="teamCardsList" class="record-list"></div>
            </section>

            <section class="panel data collapsed-preview">
                <h2>Data Preview</h2>

                <div class="tool-note">
                    <p><strong>Note:</strong> This preview shows the current team object.</p>
                    <p class="path">basketball_101_data_files → overseas_teams_data.json</p>
                </div>

                <button id="copyJsonBtn" type="button">Copy JSON</button>
                <button id="saveJsonBtn" type="button">Save Team</button>
                <pre id="jsonPreview"></pre>
            </section>

        </aside>
    </div>

    <script src="overseas-team-input.js" defer></script>
</body>

</html>
