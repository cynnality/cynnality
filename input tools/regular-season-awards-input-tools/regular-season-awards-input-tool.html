<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Regular Season Awards Input Tool</title>
    <link rel="stylesheet" href="regular-season-awards-input-tool.css" />

<!-- ======================== MONO FONTS ========================
         CHIVO MONO 
         ---- (monospaced // kinda playful ? serif) 

         DM MONO 
         ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

         JET BRAINS MONO 
         ---- (monospaced, generally sans-serif. 
         ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
         ============================================================-->

    <!--=====================================================================================

COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
wnba_reg_season_awards.json /////// -> regular season PLAYER awards
wnba_season_stats.json //////////// -> regular season team rankings
wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!--=====================================================================================-->

</head>

<body>
    <main class="tool-shell">
        <header class="tool-header">
            <p class="eyebrow">WNBA Data Tool</p>
            <h1>Regular Season Awards Input</h1>
            <p>Add or update regular season award winners by season.</p>
        </header>

        <section class="panel">
            <div class="form-grid">
                <label>
                    Season
                    <input id="seasonInput" type="number" value="2025" />
                </label>

                <label>
                    Award Preset
                    <select id="awardPresetInput">
                        <option value="">Select award</option>
                        <option value="mvp">Most Valuable Player</option>
                        <option value="dpoy">Defensive Player of the Year</option>
                        <option value="roy">Rookie of the Year</option>
                        <option value="mip">Most Improved Player</option>
                        <option value="sixth_player">Sixth Player of the Year</option>
                        <option value="coach_of_the_year">Coach of the Year</option>
                        <option value="executive_of_the_year">Executive of the Year</option>
                        <option value="sportsmanship">Sportsmanship Award</option>
                        <option value="kim_perrot_sportsmanship">Kim Perrot Sportsmanship Award</option>
                        <option value="custom">Custom / Other</option>
                    </select>
                </label>

                <label>
                    Award Key
                    <input id="awardKeyInput" placeholder="peak_performer_fg_pct" />
                </label>

                <label>
                    Award Name
                    <input id="awardNameInput" placeholder="Peak Performer: Field Goal Percentage" />
                </label>

                <label>
                    Recipient Name
                    <input id="recipientNameInput" placeholder="A'ja Wilson" />
                </label>

                <label>
                    Generated Player ID
                    <input id="playerIdInput" />
                </label>

                <label>
                    Recipient Team
                    <select id="teamCodeInput">
                        <option value="">Select team</option>
                    </select>
                </label>
            </div>

            <label>
                Notes
                <textarea id="notesInput" rows="4"></textarea>
            </label>

            <button id="saveAwardBtn" type="button">Save Award</button>

            <p id="statusMessage" class="status-message"></p>
        </section>

        <section class="panel">
            <h2>Saved Awards</h2>
            <div id="savedAwardsList" class="saved-awards-list"></div>
        </section>
    </main>

    <script src="regular-season-awards-input-tool.js"></script>
</body>
</html>
