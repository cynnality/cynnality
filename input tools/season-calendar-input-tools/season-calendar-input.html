<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Season Calendar Input Tool</title>

    <!-- ======================== MONO FONTS ========================
         CHIVO MONO 
         ---- (monospaced // kinda playful ? serif) 

         DM MONO 
         ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

         JET BRAINS MONO 
         ---- (monospaced, generally sans-serif. 
         ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
         ============================================================-->

    <!--=====================================================================================

COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
wnba_reg_season_awards.json /////// -> regular season PLAYER awards
wnba_season_stats.json //////////// -> regular season team rankings
wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!--=====================================================================================-->

    <link rel="stylesheet" href="season-calendar-input.css" />
</head>

<body>
    <main class="tool-shell">
        <header class="tool-header">
            <p class="eyebrow">WNBA Data Tool</p>
            <h1>Season Calendar Input</h1>
            <p>create / edit season schedule</p>
        </header>

        <section class="panel">
            <label>
                Season
                <select id="seasonSelect">
                    <option value="2026">2026</option>
                </select>
            </label>
        </section>

        <section class="panel gameday-builder-panel">
            <button id="toggleGamedayBuilderBtn" class="section-toggle" type="button">
                Add Gameday Matchups
            </button>

            <div id="gamedayBuilderContent" class="gameday-builder-content hidden">

            <section class="panel">
                <h2>Gameday Matchup Builder</h2>

                <div class="form-grid">
                    <label>
                        Game Date
                        <input id="gameDateInput" type="date" />
                    </label>

                    <label>
                        Games on This Date
                        <input id="gamesOnDateInput" type="number" min="1" placeholder="optional" />
                    </label>
                </div>

                <button id="generateGameRowsBtn" type="button">
                    Generate Game Rows
                </button>

                <div id="matchupRowsContainer" class="matchup-rows-container"></div>

                <button id="saveGameBtn" type="button">
                    Save Gameday Matchups
                </button>
            </section>
            </div>
        </section>

        <section id="savedGamesPanel" class="panel">

            <h2>Saved Games</h2>

            <p class="section-description">
                Existing matchups for the selected season.
            </p>

            <div id="savedGamesList" class="list"></div>

        </section>
        
        <section id="gameEditorPanel" class="panel hidden">

            <h2>Game Editor</h2>

            <p id="gameContext"></p>

            <div id="matchupPanel"></div>

            <div class="score-grid">

                <label>
                    <span id="awayScoreLabel">Away Score</span>
                    <input id="awayScoreInput" type="number">
                </label>

                <label>
                    <span id="homeScoreLabel">Home Score</span>
                    <input id="homeScoreInput" type="number">
                </label>

            </div>

            <label class="checkbox-row">
                <input id="isFinalInput" type="checkbox">
                Game is final
            </label>

            <div class="game-nav">

                <button id="prevGameBtn" type="button">
                    ← Previous Game
                </button>

                <button id="backToCalendarBtn" type="button">
                    Back To Calendar
                </button>

                <button id="nextGameBtn" type="button">
                    Next Game →
                </button>

            </div>

            <button id="saveScoreBtn" type="button">
                Save Final Score
            </button>

            <p id="scoreStatusMessage"></p>

        </section>

    </main>

    <script src="season-calendar-input.js"></script>
</body>
</html>
