<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>college-input</title>

    <!-- ======================== MONO FONTS ========================
         CHIVO MONO 
         ---- (monospaced // kinda playful ? serif) 

         DM MONO 
         ---- (monospaced, serif, gives digital feel - could be good replacement for v323)

         JET BRAINS MONO 
         ---- (monospaced, generally sans-serif. 
         ---- want to use for all caps / titles / such things big bold (and oblique) style header feel)
         ============================================================-->

    <!--=====================================================================================

COPIED ALL WNBA DATA FILES, AND MOVED THEM INTO "basketball_101_data_files" FOLDER !!!!

wnba_colleges.json //////////////// ->  college id's / college names / college nickanmes 
wnba_finals.json ////////////////// -> finals matchups / winners / coaches / finals mvps
wnba_olympic_players.json ///////// -> data connecting players to olympic jersey numbers/rosters AND wnba teams
wnba_reg_season_awards.json /////// -> regular season PLAYER awards
wnba_season_stats.json //////////// -> regular season team rankings
wnba_static_data.json ///////////// -> static main/general data for WNBA (team colors, ids, locations, etc.)
wnba_teams_history.json /////////// -> teams of the WNBA by year and team franchise lineage

=====================================================================================-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
    <!--=====================================================================================-->

    <link rel="stylesheet" href="college-input.css">
</head>

<body>

    <div class="top-pager">
        <h1><em>add a college</em></h1>

        <div class="tool-note">
            <p><strong>Note:</strong> JSON is generated as <em><u>single college object</u></em></p>

            <p>to be pasted into main colleges data file</p>
            <p>Copied JSON does <strong>NOT</strong> include trailing comma</p>

            <p class="path">
                main project folder → basketball_101_data_files → wnba_colleges.json
            </p>

        </div>
    </div>
    <div class="tool-wrap">
        <section class="tool-shell">

            <section class="panel input">
                <h2>College Info</h2>

                <input id="collegeName" placeholder="College name, ex: University of Maryland">

                <div class="id-row">
                    <input id="collegeId" placeholder="collegeId auto-generated" readonly>
                    <button id="editCollegeIdBtn" type="button">Edit collegeId</button>
                </div>
            </section>

            <section class="panel input">
                <h2>Reference Names</h2>

                <input id="refName1" placeholder="Ref name 1, ex: Maryland">
                <input id="refName2" placeholder="Ref name 2, ex: Terrapins">
                <input id="refName3" placeholder="Ref name 3, optional">
                <input id="refName4" placeholder="Ref name 4, optional">
            </section>
        </section>

        <section class="panel data">
            <h2>Data Preview</h2>

            <button id="copyJsonBtn" type="button">Copy JSON</button>
            <pre id="jsonPreview"></pre>
        </section>
    </div>

    <script src="college-input.js" defer></script>
</body>

</html>
