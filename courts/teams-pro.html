<script>
    fetch('teams-pro.json')
        .then(res => res.json())
        .then(data => {
            Object.values(data).forEach(team => {
                const card = document.getElementById(`team-${team.teamCode}`);
                if (card && team.colors) {
                    card.style.setProperty('--team-color1', team.colors.color1);
                    card.style.setProperty('--team-color2', team.colors.color2);
                    card.style.setProperty('--team-color3', team.colors.color3);
                }
                if (card) {
                    card.querySelector('.team-name-city').textContent = team.teamNameCity;
                    card.querySelector('.team-name').textContent = team.teamName;

                    // Build details string conditionally
                    let details = "";
                        if (team.isOriginalTeam) {
                            details += `<div class="detail_row">OG WNBA Team</div>`;
                        }
                        details += 
                            `<div class="detail_row">Founded: ${team.founded}</div>
                            <div class="detail_row">City: ${team.city}</div>
                            <div class="detail_row">Championships: ${team.chipCount}</div>`;
                        if (team.chipYear && team.chipYear.length) {
                            details += `<div class="detail_row">Championship Year(s): ${team.chipYear.join(", ")}</div>`;
                        }
                        if (team.formerTeam) {
                            const formerTeamName = Object.values(data).find(t => t.teamCode === team.formerTeam)?.teamName || team.formerTeam;
                            details += `<div class="detail_row">Former Team: ${formerTeamName}</div>`;
                        }
                        if (team.foldedYear) {
                            details += `<div class="detail_row">Folded: ${team.foldedYear}</div>`;
                        }
                    card.querySelector('.team-details').innerHTML = details;

                    // Set colors
                    const colorsDivs = card.querySelectorAll('.team-colors');
                    if (colorsDivs.length && team.colors) {
                        colorsDivs.forEach(colorsDiv => {
                            colorsDiv.querySelector('.color1').style.background = team.colors.color1 || '#ccc';
                            colorsDiv.querySelector('.color2').style.background = team.colors.color2 || '#ccc';
                            colorsDiv.querySelector('.color3').style.background = team.colors.color3 || '#ccc';
                        });
                    }
                }
            });
        });
</script>
