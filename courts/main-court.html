<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: "Inter", sans-serif;
      font-style: normal;
      background: #e3e3e3;
      /* #E3E3E3 - neutral bg #7F00FF - blue-purple ---- cant decide */
    }
    p {
      margin: 0;
    }

    .off-center-section {
      border: solid 3px #000000;
      width: 56em;
    }

    .box-description {
      position: relative;
      display: grid;
      padding: .5em;
      border-bottom: 2px solid #000000;
      width: fit-content;
    }

    .section-title {
      font-family: "Inter", sans-serif;
      font-style: italic;
      font-size: 32px;
      font-weight: 600;
      color: #000000;
      position: relative;
    }

    .small-description {
      font-family: "Inter", sans-serif;
      font-style: italic;
      font-weight: 100;
      color: #000000;
      position: relative;
    }

    .off-center-box {
      display: grid;
      position: relative;
    }

    .off-center-box .outie {
      display: grid;
      border: 2px solid #000000;
    }

    .off-center-box .innie {
      display: grid;
      align-self: center;
      justify-self: center;
      transition: transform 0.1s ease-in-out;
      position: relative;
    }

    .off-center-box .innie:hover {
      transform: scale(1.35);
      z-index: 1;
    }

    .off-center-box .innie .innie-text {
      align-self: center;
      justify-self: center;
      font-family: "Inter", sans-serif;
      font-style: italic;
      font-size: 1em;
      color: #000000;
    }

    .off-center-box a {
      text-align: center;
      align-self: center;
      justify-self: center;
      font-family: "Inter", sans-serif;
      font-style: italic;
      font-size: 1em;
      color: #000000;
      text-decoration: none;
    }

    .off-center-box.looks {
      top: 3.5em;
      left: 2em;
    }

    .off-center-box.looks .outie {
      width: 15em;
      height: 15em;
    }

    .off-center-box.looks .innie {
      width: 12em;
      height: 12em;
      background-color: #00de51;
    }

    .off-center-box.looks .innie:hover {
      transform: scale(1.27);
      z-index: 1;
    }

    .off-center-box.watching {
      top: -0.4em;
      left: 36.1em;
    }

    .off-center-box.watching .outie {
      width: 18em;
      height: 18em;
    }

    .off-center-box.watching .innie {
      width: 16em;
      height: 16em;
      background-color: #ff211d;
    }

    .off-center-box.watching .innie:hover {
      transform: scale(1.15);
    }

    .off-center-box.teams {
      top: -3.1em;
      left: 26.7em;
    }

    .off-center-box.teams .outie {
      width: 12em;
      height: 12em;
    }

    .off-center-box.teams .innie {
      width: 9em;
      height: 9em;
      background-color: #1a4cff;
    }

    .off-center-box.tickets {
      top: -6.4em;
      left: 17.6em;
    }
    .off-center-box.tickets .outie {
      width: 12em;
      height: 12em;
    }
    .off-center-box.tickets .innie {
      width: 9em;
      height: 9em;
      background-color: #1a4cff;
    }

    .court-text {
      background: #e3e3e3;
      width: 9em;
      top: 18em;
      left: 52em;
      text-align: center;
      border: 3px solid #000000;
    }

    .court-text h3 {
      padding: .5em .25em;
      font-style: italic;
    }

    .court-text p {
      padding: .25em;
    }

    .court-key {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: dashed 2px #000;
      width: 6.25em;
      position: relative;
      top: -16em;
      left: 48em;
    }

    .court-key .blu-box {
      background-color: #1a4cff;
      display: block;
      width: 3em;
      height: 3em;
    }
    .court-key .blu-desc {
        width: 6em;
        display: flex;
        text-align: right;
    }
    .court-key .blu-desc p {
      font-family: "Inter", sans-serif;
      font-style: italic;
      font-weight: 100;
    }

    .testing {
      position: relative;
      top: 1em;
      left: 1em;
    }

    .testing-png {
      border: solid 2px #000000;
      padding-right: 6px;
    }

    .testing-png:hover {
      background-color: #ffffff;
    }

  </style>
</head>



<body>

        </div>
      </div>
      <div class="off-center-box teams">
        <div class="outie">
          <a href="page-wnba/teams-wnba.html">

                <h1>teams</h1>
              </div>
            </div>
          </a>
        </div>
      </div>
      <div class="off-center-box tickets">
        <div class="outie">

          </a>
        </div>
      </div>
