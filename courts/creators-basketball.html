  <style>
    
    body {
    font-family: "Inter", sans-serif;
    font-style: normal;
    background: #e3e3e3; /* #E3E3E3 - neutral bg #7F00FF - blue-purple ---- cant decide */
    }

    p {
        margin: 0;
    }


    .off-center-section {
      border: solid 3px #000000;
      width: 60em;
    }
    .box-description {
      margin-top: .5em;
      margin-left: 1.5em;
    }
    .section-title {
      font-style: italic;
      color: #000000;
      position: relative;
      font-size: 32px;
      font-weight: 600;
    }
    .small-description {
      font-style: italic;
      font-weight: 100;
      color: #000000;
      position: relative;
    }

        .off-center-box {
            display: grid;
            position: relative;
        }
        .off-center-box .outie {
            display: flex;
        }
        .off-center-box .innie {
            display: grid;
            align-self: center;
            justify-self: center;
            transition: transform 0.1s ease-in-out;
            position: relative;
            display: grid;
            gap: 1em;
            width: 24em;
        }
        .off-center-box .innie .innie-text {
            position: relative;
            border: solid 2px #000000;
            background-color: #e3e3e39a;
            border-radius: 6px;
            display: flex;
            justify-content: right;
            font-style: italic;
        }
        .innie .innie-text a {
            font-style: italic;
            font-size: 1em;
            color: #000000;
        }
        .innie .innie-text a h1 {
            margin: .25em;
        }

        .innie .innie-text a h1 {
            color: #000000;
            text-decoration: none;
        }


        .splash-squad-wbb-img {
            width: 32em;
            border-radius: 6px;
            margin: .5em;
            z-index: 1;
        }
        .splash-squad-wbb .innie {
            position: relative;
            left: -3.5em;
        }


        .womens-basketball-universe-img {
            width: 32em;
            border-radius: 6px;
            margin: .5em;
            z-index: 1;
        }
        .womens-basketball-universe .innie {
            position: relative;
            left: -3.5em;
        }

  </style>
