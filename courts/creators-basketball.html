<!DOCTYPE html>

  <style>
    
    body {
    font-family: "Inter", sans-serif;
    font-style: normal;
    background: #e3e3e3; /* #E3E3E3 - neutral bg #7F00FF - blue-purple ---- cant decide */
    }

    .off-center-section {
      border: solid 3px #000000;
      width: 40em;
    }
    .section-title {
      font-family: "Inter", sans-serif;
      font-style: italic;
      color: #000000;
      position: relative;
      top: 14em;
      left: .5em;
      font-size: 32px;
      font-weight: 600;
    }

    .off-center-box {
            display: grid;
            position: relative;
        }
        .off-center-box .outie {
            display: grid;
            border: 2px solid #000000;
        }
        .off-center-box .innie {
            display: grid;
            align-self: center;
            justify-self: center;
            transition: transform 0.1s ease-in-out;
            position: relative;
        }
        .off-center-box .innie:hover {
            transform: scale(1.35);
            z-index: 1;
        }
        .off-center-box .innie .innie-text {
            align-self: center;
            justify-self: center;
            font-family: "Inter", sans-serif;
            font-style: italic;
            font-size: 1em;
            color: #000000;
        }
        .off-center-box a {
            align-self: center;
            justify-self: center;
            font-family: "Inter", sans-serif;
            font-style: italic;
            font-size: 1em;
            color: #000000;
            text-decoration: none;
        }

        .off-center-box.looks {
            top: 2em;
            left: 8em;
        }
        .off-center-box.looks .outie {
            width: 15em;
            height: 15em;
        }
        .off-center-box.looks .innie {
            width: 12em;
            height: 12em;
            background-color: #00de51;
        }

        .off-center-box.teams {
            top: -1.4em;
            left: 20em;
        }
        .off-center-box.teams .outie {
            width: 12em;
            height: 12em;
        }
        .off-center-box.teams .innie {
            width: 9em;
            height: 9em;
            background-color: #1a4cff;
        }

  </style>
</head>



<body>
  <div class="off-center-section">
