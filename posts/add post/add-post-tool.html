<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Add Post Tool</title> 

    <link rel="stylesheet" href="add-post-tool.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chivo+Mono:ital,wght@0,100..900;1,100..900&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="tool-shell">
        <div class="helpers">
            <div class="vert-bar">
                <header class="tool-header">
                    <h1>Add a Post</h1>
                </header>

                <section class="panel" id="postPagePanel">
                    <h2>add it to a page</h2>

                    <label>
                        Existing Page
                        <select id="pageSelect">
                            <option value="general">General</option>
                        </select>
                    </label>
                </section>

            </div>

            <section class="panel" id="postSetupPanel">
                <h2>Post Setup</h2>

                <div class="form-grid">
                    <label>
                        Post Title
                        <input id="postTitleInput" placeholder="My First Post" />
                    </label>

                    <label>
                        Status
                        <select id="statusInput">
                            <option value="draft">Draft</option>
                            <option value="published">Published</option>
                        </select>
                    </label>

                    <label>
                        Tags
                        <input id="tagsInput" placeholder="personal, blog, notes" />
                    </label>

                    <label>
                        Content Type
                        <select id="contentTypeInput">
                            <option value="markdown-html">Markdown + HTML</option>
                        </select>
                    </label>
                </div>
            </section>

            <section class="panel collapsible-panel collapsed" id="advancedPostPanel">
                <button
                    class="panel-toggle"
                    type="button"
                    data-closed-label="View advanced post settings"
                    data-open-label="Hide advanced post settings">
                    View advanced post settings
                </button>

                <div class="panel-body">
                    <div class="form-grid">
                        <label>
                            Post ID
                            <input id="postIdInput" placeholder="my_first_post" />
                        </label>

                        <label>
                            Slug
                            <input id="slugInput" placeholder="my-first-post" />
                        </label>

                        <label>
                            Content File Path
                            <input id="contentFileInput" placeholder="auto-generated" />
                        </label>

                        <label>
                            Style File Path
                            <input id="styleFileInput" placeholder="auto-generated" />
                        </label>
                    </div>
                </div>
            </section>
        </div>

                <section class="mini-toolbar" id="textWrapToolbar">
                    <p class="toolbar-label">Text tools</p>

                    <div class="toolbar-buttons">
                        <button type="button" data-wrap-tag="strong">Bold</button>
                        <button type="button" data-wrap-tag="em">Italic</button>
                        <button type="button" data-wrap-tag="u">Underline</button>
                        <button type="button" data-wrap-tag="mark">Mark</button>
                    </div>

                    <div class="class-wrap-row">
                        <input id="wrapClassInput" placeholder="class name: hindu, muslim, important" />
                        <button id="wrapClassBtn" type="button">+ marker to text</button>
                    </div>
                </section>

                <section class="mini-toolbar marker-builder" id="markerBuilder">
                    <div class="marker-toolbar-header">
                        <p class="toolbar-label">Markers</p>
                        <button id="openMarkerPanelBtn" type="button">+ Add Marker</button>
                    </div>

                    <div id="markerPills" class="marker-pills"></div>

                    <div id="markerPanel" class="marker-panel hidden">
                        <div class="class-style-grid">
                            <input id="classNameInput" placeholder="marker name: hindu" />

                            <div class="opacity-field">
                                <input id="classBackgroundInput" placeholder="background: #7ea7ff" />
                                <button id="backgroundOpacityBtn" type="button">Opacity</button>

                                <div id="backgroundOpacityPanel" class="opacity-panel hidden">
                                    <label>
                                        Background opacity
                                        <input id="backgroundOpacitySlider" type="range" min="0" max="100" value="50" />
                                    </label>
                                    <p id="backgroundOpacityValue">50%</p>
                                </div>
                            </div>

                            <input id="classColorInput" placeholder="text color: #111" />

                            <button id="addClassStyleBtn" type="button">Add</button>
                        </div>
                    </div>
                </section>

                <section class="panel" id="boxBuilderPanel">
                    <h2>Box Builder</h2>

                    <div class="form-grid">
                        <label>
                            Class Name
                            <input id="boxClassInput" placeholder="conflict-card" />
                        </label>

                        <label>
                            Tag
                            <select id="boxTagInput">
                                <option value="div">div</option>
                                <option value="section">section</option>
                                <option value="article">article</option>
                                <option value="aside">aside</option>
                            </select>
                        </label>

                        <label>
                            Background
                            <input id="boxBackgroundInput" placeholder="#f4ead2" />
                        </label>

                        <label>
                            Text Color
                            <input id="boxColorInput" placeholder="#111" />
                        </label>

                        <label>
                            Border
                            <input id="boxBorderInput" placeholder="2px solid #111" />
                        </label>

                        <label>
                            Border Radius
                            <input id="boxBorderRadiusInput" placeholder="8px" />
                        </label>

                        <label>
                            Padding
                            <input id="boxPaddingInput" placeholder="12px" />
                        </label>

                        <label>
                            Margin
                            <input id="boxMarginInput" placeholder="12px 0" />
                        </label>

                        <label>
                            Width
                            <input id="boxWidthInput" placeholder="auto" />
                        </label>

                        <label>
                            Min Height
                            <input id="boxMinHeightInput" placeholder="120px" />
                        </label>

                        <label>
                            Display
                            <input id="boxDisplayInput" placeholder="block" />
                        </label>

                        <label>
                            Gap
                            <input id="boxGapInput" placeholder="12px" />
                        </label>
                    </div>

                    <button id="createBoxBtn" type="button">Create Box</button>
                </section>

        <section class="panel editor-panel">
            <h2>Post Editor</h2>

        <section class="panel" id="selectedElementPanel">
            <h2>Selected Element</h2>

            <div id="selectedElementInfo">

                <p>
                    <strong>Tag:</strong>
                    <span id="selectedTag">-</span>
                </p>

                <p>
                    <strong>Class:</strong>
                    <span id="selectedClass">-</span>
                </p>

                <p>
                    <strong>ID:</strong>
                    <span id="selectedId">-</span>
                </p>

                <p>
                    <strong>Text:</strong>
                    <span id="selectedText">-</span>
                </p>

                <div class="selected-css-box">
                    <h3>Matching CSS</h3>
                    <pre id="selectedCssBlock">No CSS block found yet.</pre>
                </div>

                <div class="style-inspector-fields">
                    <label>
                        Background
                        <input id="inspectBackgroundInput" />
                    </label>

                    <label>
                        Color
                        <input id="inspectColorInput" />
                    </label>

                    <label>
                        Border
                        <input id="inspectBorderInput" />
                    </label>

                    <label>
                        Border Radius
                        <input id="inspectBorderRadiusInput" />
                    </label>

                    <label>
                        Padding
                        <input id="inspectPaddingInput" />
                    </label>

                    <label>
                        Margin
                        <input id="inspectMarginInput" />
                    </label>

                    <button id="applyInspectorStylesBtn" type="button">
                        Apply Style Changes
                    </button>
                </div>

            </div>
        </section>

            <div class="editor-layout">
                <div class="editor-side">



                    <label>
                        <textarea id="contentInput" class="large-textarea" placeholder="# My First Post&#10;&#10;<div class=&quot;callout&quot;>Styled content here.</div>"></textarea>
                    </label>

                    <label>
                        Custom CSS
                        <textarea id="styleInput" class="style-textarea" placeholder=".callout {&#10;    border: 2px solid #111;&#10;    padding: 12px;&#10;}"></textarea>
                    </label>
                </div>

                <button id="togglePreviewGridBtn" type="button">
                    Toggle Grid
                </button>

                <section class="preview-side">
                    <style id="previewStyle"></style>
                    <div id="postPreview" class="post-preview"></div>
                </section>
            </div>
        </section>

        <section class="panel actions-panel">
            <button id="generatePreviewBtn" type="button">Generate Preview</button>
            <button id="savePostBtn" type="button">Save Post</button>
            <p id="statusMessage" class="status-message"></p>
        </section>

        <section class="panel collapsible-panel collapsed" id="jsonPreviewPanel">
            <button
                class="panel-toggle"
                type="button"
                data-closed-label="View post JSON data"
                data-open-label="Hide post JSON data"> 
                View post JSON data
            </button>

            <div class="panel-body">
                <pre id="jsonPreview">{}</pre>
            </div>
        </section>
    </main>

    <script src="../shared/visual-builder-core.js"></script>
    <script src="add-post-tool.js"></script>
</body>
</html>
